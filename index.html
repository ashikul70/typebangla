<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TypeBangla v21 — Smart Flow & Clear Completion</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Mono:wght@400;500;700&family=DM+Sans:wght@300;400;500;600&family=Noto+Sans+Bengali:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
:root{
  --bg:#0a0d13;--bg2:#111520;--surface:#171e2e;--surface2:#1e2840;
  --border:#253045;--border2:#2e3d5a;
  --ink:#dde4f0;--ink2:#8fa0bf;--muted:#4a5a78;
  --accent:#e8512a;--correct:#2dd4a0;--incorrect:#f87171;--cursor:#fbbf24;
  --radius:12px;--shadow:0 4px 28px rgba(0,0,0,0.45);
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--ink);height:100vh;display:flex;flex-direction:column;overflow:hidden;}

nav{height:60px;background:var(--bg2);border-bottom:1px solid var(--border);padding:0 20px;display:flex;align-items:center;justify-content:space-between;z-index:50;}
.logo{font-family:'Playfair Display',serif;font-size:1.4rem;font-weight:900;}
.logo em{color:var(--accent);font-style:normal;}

.layout{display:flex;flex:1;overflow:hidden;}
.sidebar{width:340px;background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;}
.sidebar-header{padding:15px;border-bottom:1px solid var(--border);font-size:0.8rem;color:var(--muted);text-transform:uppercase;letter-spacing:1px;display:flex;justify-content:space-between;align-items:center;}
.lesson-list{overflow-y:auto;flex:1;scroll-behavior:smooth;}
.li{padding:12px 15px;cursor:pointer;border-left:4px solid transparent;transition:0.2s;border-bottom:1px solid var(--border);font-size:0.85rem;display:flex;justify-content:space-between;align-items:center; gap: 8px;}
.li:hover{background:var(--surface);}
.li.active{border-left-color:var(--accent);background:var(--surface2);}

.li.completed {
    border-left-color: var(--correct);
    background: rgba(45, 212, 160, 0.08);
}
.li.completed .li-text {
    text-decoration: line-through;
    color: var(--ink2);
    opacity: 0.6;
}

.li-text{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.actions {display:flex; gap:6px;}
.icon-btn{background:none;border:none;cursor:pointer;opacity:0.5;font-size:1.1rem;transition:0.2s;}
.icon-btn:hover{opacity:1;transform:scale(1.1);}
.btn-check{color:var(--correct);}
.btn-del{color:var(--incorrect);}

.main{flex:1;display:flex;flex-direction:column;background:var(--bg);}
.meanings-strip{background:var(--bg2);border-bottom:1px solid var(--border);padding:12px 20px;min-height:65px;}
.chips{display:flex;flex-wrap:wrap;gap:10px;}
.chip{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:6px 14px;}
.chip.hl{border-color:var(--accent);background:rgba(232,81,42,0.15);}

.content-area{flex:1;padding:30px;display:flex;flex-direction:column;gap:20px;max-width:950px;margin:0 auto;width:100%;overflow-y:auto;}
.text-display{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:30px;font-family:'DM Mono',monospace;font-size:1.5rem;line-height:2.2;box-shadow:var(--shadow);min-height:140px;position:relative;}
.ch.ok{color:var(--correct);}
.ch.bad{color:var(--incorrect);background:rgba(248,113,113,0.1);}
.ch.cursor{border-bottom:3px solid var(--cursor);animation:blink 1s infinite;}
@keyframes blink { 50% { border-color: transparent; } }

/* Enter hint bar shown when part is fully typed */
.enter-hint{
  display:none;
  align-items:center;gap:10px;
  background:rgba(45,212,160,0.12);
  border:1px solid var(--correct);
  border-radius:8px;padding:10px 18px;
  font-size:0.9rem;color:var(--correct);font-weight:600;
  animation:fadeIn 0.3s ease;
}
.enter-hint.show{display:flex;}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:translateY(0);}}
.enter-hint kbd{
  background:var(--correct);color:var(--bg);
  border-radius:4px;padding:2px 8px;font-family:'DM Mono',monospace;font-size:0.85rem;font-weight:700;
}

.bn-card{background:var(--surface2);border-radius:var(--radius);padding:20px;display:none;border-left:5px solid var(--accent);box-shadow:var(--shadow);}
.bn-card.show{display:block;}
.bn-text{font-family:'Noto Sans Bengali',sans-serif;font-size:1.3rem;line-height:1.6;color:#fff;}

.keyboard{display:flex;flex-direction:column;gap:8px;background:var(--surface);padding:20px;border-radius:var(--radius);border:1px solid var(--border);margin-top:auto;}
.key-row{display:flex;gap:8px;justify-content:center;}
.key{background:var(--surface2);border:1px solid var(--border2);border-radius:6px;padding:12px 0;flex:1;text-align:center;font-family:'DM Mono',monospace;font-size:1rem;color:var(--ink2);transition:0.1s ease;text-transform:uppercase;}
.key.wide{flex:2;}
.key.space{flex:10;}
.key.enter{flex:2.5;}
.key.target{background:var(--accent);color:white;border-color:var(--accent);box-shadow:0 0 15px rgba(232,81,42,0.5);transform:scale(1.05);z-index:2;font-weight:bold;}
.key.target-enter{background:var(--correct);color:var(--bg);border-color:var(--correct);box-shadow:0 0 15px rgba(45,212,160,0.5);transform:scale(1.05);z-index:2;font-weight:bold;}
.key.pressed{background:var(--correct);color:var(--bg);transform:translateY(2px);}

#upload-btn{padding:10px 22px;background:var(--accent);color:white;border:none;border-radius:6px;font-weight:700;cursor:pointer;}
</style>
</head>
<body>

<nav>
  <div class="logo">Type<em>বাংলা</em></div>
  <input type="file" id="pdf-upload" accept=".pdf" style="display:none">
  <button id="upload-btn" onclick="document.getElementById('pdf-upload').click()">Upload PDF</button>
</nav>

<div class="layout">
  <aside class="sidebar">
    <div class="sidebar-header">
      <span>Lesson Parts</span>
      <span id="progress" style="color:var(--correct);font-weight:bold;">0/0</span>
    </div>
    <div class="lesson-list" id="lesson-list"></div>
  </aside>

  <div class="main">
    <div class="meanings-strip"><div class="chips" id="chips"></div></div>
    <div class="content-area">
      <div class="text-display" id="text-display">Upload a PDF to begin typing.</div>

      <!-- Enter hint: visible only when part is fully typed -->
      <div class="enter-hint" id="enter-hint">
        <kbd>Enter</kbd>
        <span>Part complete — press Enter to go to the next part</span>
      </div>
      
      <div class="bn-card" id="bn-card">
        <div style="font-size: 0.7rem; color: var(--accent); text-transform: uppercase; margin-bottom: 8px; font-weight: 700;">Real Meaning</div>
        <div class="bn-text" id="bn-text"></div>
      </div>

      <div class="keyboard" id="keyboard">
        <div class="key-row">
          <div class="key" data-key="`">`</div><div class="key" data-key="1">1</div><div class="key" data-key="2">2</div><div class="key" data-key="3">3</div><div class="key" data-key="4">4</div><div class="key" data-key="5">5</div><div class="key" data-key="6">6</div><div class="key" data-key="7">7</div><div class="key" data-key="8">8</div><div class="key" data-key="9">9</div><div class="key" data-key="0">0</div><div class="key" data-key="-">-</div><div class="key" data-key="=">=</div><div class="key wide" data-key="backspace">Bksp</div>
        </div>
        <div class="key-row">
          <div class="key wide" data-key="tab">Tab</div><div class="key" data-key="q">Q</div><div class="key" data-key="w">W</div><div class="key" data-key="e">E</div><div class="key" data-key="r">R</div><div class="key" data-key="t">T</div><div class="key" data-key="y">Y</div><div class="key" data-key="u">U</div><div class="key" data-key="i">I</div><div class="key" data-key="o">O</div><div class="key" data-key="p">P</div><div class="key" data-key="[">[</div><div class="key" data-key="]">]</div><div class="key" data-key="\">\\</div>
        </div>
        <div class="key-row">
          <div class="key wide" data-key="capslock">Caps</div><div class="key" data-key="a">A</div><div class="key" data-key="s">S</div><div class="key" data-key="d">D</div><div class="key" data-key="f">F</div><div class="key" data-key="g">G</div><div class="key" data-key="h">H</div><div class="key" data-key="j">J</div><div class="key" data-key="k">K</div><div class="key" data-key="l">L</div><div class="key" data-key=";">;</div><div class="key" data-key="'">'</div><div class="key enter" data-key="enter">Enter</div>
        </div>
        <div class="key-row">
          <div class="key wide" data-key="shift">Shift</div><div class="key" data-key="z">Z</div><div class="key" data-key="x">X</div><div class="key" data-key="c">C</div><div class="key" data-key="v">V</div><div class="key" data-key="b">B</div><div class="key" data-key="n">N</div><div class="key" data-key="m">M</div><div class="key" data-key=",">,</div><div class="key" data-key=".">.</div><div class="key" data-key="/">/</div><div class="key wide" data-key="shift">Shift</div>
        </div>
        <div class="key-row">
          <div class="key space" data-key="space">Space</div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

const WORD_DB = { "a": "একটি", "the": "টি", "is": "হয়", "are": "হয়" };
const banglaRegex = /[\u0980-\u09FF]/; 

let LESSONS = [];
let currentLesson = null;
let typedText = "";

document.getElementById('pdf-upload').addEventListener('change', async (e) => {
    const file = e.target.files[0];
    if (!file) return;

    document.getElementById('text-display').textContent = "Processing PDF Parts... Please wait.";

    const reader = new FileReader();
    reader.onload = async function() {
        try {
            const typedarray = new Uint8Array(this.result);
            const pdf = await pdfjsLib.getDocument(typedarray).promise;
            let rawSentences = [];
            
            for (let i = 1; i <= pdf.numPages; i++) {
                const page = await pdf.getPage(i);
                const content = await page.getTextContent();
                const pageText = content.items.map(item => item.str).join(" ");
                const splitPage = pageText.match(/[^.!?]+[.!?]+/g) || [pageText];
                rawSentences.push(...splitPage);
            }

            LESSONS = [];
            let currentChunk = "";
            let chunkId = 0;

            rawSentences.forEach(sentence => {
                let cleanSentence = sentence.replace(/\s+/g, ' ').trim();
                if (cleanSentence.length < 5) return; 
                
                if ((currentChunk.length + cleanSentence.length) < 120) {
                    currentChunk += " " + cleanSentence;
                } else {
                    if (currentChunk.trim().length > 0) {
                        LESSONS.push({ id: chunkId++, en: currentChunk.trim(), bn: null, completed: false });
                    }
                    currentChunk = cleanSentence;
                }
            });
            if (currentChunk.trim().length > 0) {
                LESSONS.push({ id: chunkId, en: currentChunk.trim(), bn: null, completed: false });
            }

            renderSidebar();
            if(LESSONS.length > 0) loadLesson(LESSONS[0].id);
        } catch (err) {
            document.getElementById('text-display').textContent = "Error: Could not read PDF.";
        }
    };
    reader.readAsArrayBuffer(file);
});

function renderSidebar() {
    const list = document.getElementById('lesson-list');
    const completedCount = LESSONS.filter(l => l.completed).length;
    document.getElementById('progress').textContent = `${completedCount}/${LESSONS.length}`;

    list.innerHTML = LESSONS.map((l, index) => `
        <div class="li ${currentLesson?.id === l.id ? 'active' : ''} ${l.completed ? 'completed' : ''}" onclick="loadLesson(${l.id})">
            <div class="li-text">${l.completed ? '✅ ' : `Part ${index + 1}: `}${l.en}</div>
            <div class="actions">
                ${!l.completed ? `<button class="icon-btn btn-check" title="Mark as Done" onclick="manualComplete(${l.id}, event)">✔️</button>` : ''}
                <button class="icon-btn btn-del" title="Remove part" onclick="removeLesson(${l.id}, event)">🗑️</button>
            </div>
        </div>
    `).join('');
}

function manualComplete(id, event) {
    event.stopPropagation();
    let lesson = LESSONS.find(l => l.id === id);
    if(lesson) lesson.completed = true;
    
    if(currentLesson?.id === id) {
        goToNextLesson();
    } else {
        renderSidebar();
    }
}

function removeLesson(id, event) {
    event.stopPropagation();
    LESSONS = LESSONS.filter(l => l.id !== id);
    if(currentLesson?.id === id) {
        goToNextLesson();
    } else {
        renderSidebar();
    }
}

function goToNextLesson() {
    let currentIndex = LESSONS.findIndex(l => l.id === currentLesson?.id);
    let nextLesson = null;
    
    for(let i = currentIndex + 1; i < LESSONS.length; i++) {
        if(!LESSONS[i].completed) {
            nextLesson = LESSONS[i];
            break;
        }
    }
    
    if(!nextLesson) {
        nextLesson = LESSONS.find(l => !l.completed);
    }

    if (nextLesson) {
        loadLesson(nextLesson.id);
    } else {
        document.getElementById('text-display').innerHTML = "<div style='text-align:center;color:var(--correct)'>🎉<br><br>Congratulations! Document finished!</div>";
        document.getElementById('bn-card').classList.remove('show');
        document.getElementById('enter-hint').classList.remove('show');
        typedText = "";
        renderSidebar();
        updateKeyboardTarget();
    }
}

async function loadLesson(id) {
    currentLesson = LESSONS.find(l => l.id === id);
    if(!currentLesson) return;

    typedText = "";
    document.getElementById('bn-card').classList.remove('show');
    document.getElementById('bn-text').textContent = ""; 
    document.getElementById('enter-hint').classList.remove('show');
    
    renderDisplay();
    renderSidebar();
    
    setTimeout(() => {
        const activeItem = document.querySelector('.li.active');
        if(activeItem) {
            activeItem.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }
    }, 100);

    updateChips();
    updateKeyboardTarget();

    if (!currentLesson.bn) {
        document.getElementById('bn-text').textContent = "অনুবাদ করা হচ্ছে... (Translating...)";
        try {
            const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=bn&dt=t&q=${encodeURIComponent(currentLesson.en)}`;
            const response = await fetch(url);
            const data = await response.json();
            
            let fullTranslation = data[0].map(item => item[0]).join('');
            if(banglaRegex.test(fullTranslation)) currentLesson.bn = fullTranslation;
            else currentLesson.bn = "[সঠিক বাংলা অনুবাদ পাওয়া যায়নি]"; 

            if(typedText.length > 0) document.getElementById('bn-text').textContent = currentLesson.bn;
        } catch(err) {
            currentLesson.bn = "[অনুবাদে সমস্যা হয়েছে।]";
            if(typedText.length > 0) document.getElementById('bn-text').textContent = currentLesson.bn;
        }
    } else {
        document.getElementById('bn-text').textContent = currentLesson.bn;
    }
}

function renderDisplay() {
    const d = document.getElementById('text-display');
    if(!currentLesson) return;
    
    let html = currentLesson.en.split('').map((ch, i) => {
        let cls = i < typedText.length ? (typedText[i] === ch ? 'ok' : 'bad') : (i === typedText.length ? 'cursor' : '');
        return `<span class="ch ${cls}">${ch}</span>`;
    }).join('');
    
    if(typedText.length === currentLesson.en.length && !currentLesson.completed) {
        html += `<span class="ch cursor">&nbsp;</span>`;
    }
    
    d.innerHTML = html;
}

// Block all paste attempts (Ctrl+V, right-click paste, etc.)
window.addEventListener('paste', function(e) {
    e.preventDefault();
});

window.addEventListener('keydown', function(e) {
    // Block paste shortcut specifically before the general Ctrl check
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'v') {
        e.preventDefault();
        return;
    }
    if (e.ctrlKey || e.altKey || e.metaKey) return;
    if (!currentLesson || currentLesson.completed) return;

    if (e.key === " " || e.key === "Backspace") {
        e.preventDefault();
    }

    flashKeyboard(e.key);

    const isFullyTyped = typedText.length === currentLesson.en.length;

    if (e.key === 'Enter') {
        // ✅ KEY FIX: Enter advances to next part whenever the part is fully typed
        if (isFullyTyped) {
            currentLesson.completed = true;
            goToNextLesson();
            return;
        }
    } else if (e.key === 'Backspace') {
        typedText = typedText.slice(0, -1);
    } else if (e.key.length === 1) { 
        if(typedText.length < currentLesson.en.length) {
            typedText += e.key;
        }
    }

    // Show/hide the Enter hint and translation card
    const nowFullyTyped = typedText.length === currentLesson.en.length;
    document.getElementById('enter-hint').classList.toggle('show', nowFullyTyped);

    if(typedText.length > 0) {
        document.getElementById('bn-card').classList.add('show');
        document.getElementById('bn-text').textContent = currentLesson.bn || "অনুবাদ করা হচ্ছে...";
    } else {
        document.getElementById('bn-card').classList.remove('show');
    }

    renderDisplay();
    updateChips();
    updateKeyboardTarget();
});

function updateKeyboardTarget() {
    document.querySelectorAll('.key').forEach(k => {
        k.classList.remove('target');
        k.classList.remove('target-enter');
    });
    if(!currentLesson || currentLesson.completed) return;

    // ✅ KEY FIX: Highlight Enter key (green) whenever part is fully typed
    if (typedText.length === currentLesson.en.length) {
        document.querySelector('.key[data-key="enter"]').classList.add('target-enter');
        return;
    }

    let nextChar = currentLesson.en[typedText.length].toLowerCase();
    if (nextChar === ' ') nextChar = 'space';
    let targetKey = document.querySelector(`.key[data-key="${nextChar}"]`);
    if(targetKey) targetKey.classList.add('target');
}

function flashKeyboard(keyStr) {
    let lookupKey = keyStr.toLowerCase();
    if(lookupKey === ' ') lookupKey = 'space';
    let targetKey = document.querySelector(`.key[data-key="${lookupKey}"]`);
    if(targetKey) {
        targetKey.classList.add('pressed');
        setTimeout(() => targetKey.classList.remove('pressed'), 150); 
    }
}

async function fetchWordMeaning(word) {
    if (WORD_DB[word] || word.length <= 1) return;
    WORD_DB[word] = '...'; 
    updateChips(); 
    try {
        const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=bn&dt=t&q=${encodeURIComponent(word)}`;
        const response = await fetch(url);
        const data = await response.json();
        let translatedText = data[0][0][0];
        if(translatedText && banglaRegex.test(translatedText)) WORD_DB[word] = translatedText;
        else WORD_DB[word] = '?'; 
        updateChips();
    } catch(e) { WORD_DB[word] = '?'; updateChips(); }
}

function updateChips() {
    if(!currentLesson) return;
    const words = currentLesson.en.split(/\s+/);
    const typedWords = typedText.trim().split(/\s+/);
    let currentIdx = typedWords.length - 1 < 0 ? 0 : typedWords.length - 1;
    if (typedText.endsWith(' ')) currentIdx += 1;
    const chips = document.getElementById('chips');
    
    chips.innerHTML = words.map((w, i) => {
        const clean = w.toLowerCase().replace(/[^a-z]/g, '');
        const isVisible = (i >= currentIdx - 1 && i <= currentIdx + 2);
        if (!isVisible) return '';
        if (!WORD_DB[clean] && i === currentIdx) fetchWordMeaning(clean);
        const banglaWord = WORD_DB[clean] || '';
        return `<div class="chip ${i === currentIdx ? 'hl' : ''}">
                <span style="font-weight:700">${w}</span>
                ${(banglaWord && banglaWord !== '?') ? `<span style="color:var(--accent); font-family:'Noto Sans Bengali'">${banglaWord}</span>` : ''}
            </div>`;
    }).join('');
}
</script>
</body>
</html>
