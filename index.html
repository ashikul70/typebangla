<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TypeBangla — Connected to ATSGO</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Mono:wght@400;500;700&family=DM+Sans:wght@300;400;500;600&family=Noto+Sans+Bengali:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
:root{
  --bg:#0a0d13;--bg2:#111520;--surface:#171e2e;--surface2:#1e2840;
  --border:#253045;--border2:#2e3d5a;
  --ink:#dde4f0;--ink2:#8fa0bf;--muted:#4a5a78;
  --accent:#e8512a;--correct:#2dd4a0;--incorrect:#f87171;--cursor:#fbbf24;
  --radius:12px;--shadow:0 4px 28px rgba(0,0,0,0.45);
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--ink);height:100vh;display:flex;flex-direction:column;overflow:hidden;}

/* Navbar */
nav{height:60px;background:var(--bg2);border-bottom:1px solid var(--border);padding:0 20px;display:flex;align-items:center;justify-content:space-between;z-index:50;position:relative;}
.nav-left {display:flex;align-items:center;gap:15px;}
.logo{font-family:'Playfair Display',serif;font-size:1.4rem;font-weight:900;}
.logo em{color:var(--accent);font-style:normal;}

/* Auth UI */
.auth-overlay {position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(10, 13, 19, 0.95);backdrop-filter:blur(10px);z-index:9999;display:flex;align-items:center;justify-content:center;transition:0.3s opacity;}
.auth-overlay.hidden {opacity:0;pointer-events:none;}
.auth-card {background:var(--surface);border:1px solid var(--border);padding:40px;border-radius:var(--radius);box-shadow:var(--shadow);text-align:center;width:100%;max-width:400px;}
.auth-card h2 {font-family:'Playfair Display',serif;margin-bottom:10px;}
.auth-card p {color:var(--ink2);margin-bottom:30px;font-size:0.95rem;}
.auth-btn {width:100%;padding:12px;border-radius:8px;border:none;font-size:1rem;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:15px;transition:0.2s;}
.auth-btn.google {background:white;color:#333;}
.auth-btn.google:hover {background:#f1f1f1;}

.profile-btn {background:none;border:none;cursor:pointer;border-radius:50%;width:40px;height:40px;overflow:hidden;border:2px solid var(--border);transition:0.2s;display:none;}
.profile-btn:hover {border-color:var(--accent);}
.profile-btn img {width:100%;height:100%;object-fit:cover;}

.user-popup {position:absolute;top:65px;left:20px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px;width:260px;box-shadow:var(--shadow);z-index:100;transform:translateY(-10px);opacity:0;pointer-events:none;transition:0.2s ease;}
.user-popup.show {transform:translateY(0);opacity:1;pointer-events:all;}
.user-popup-header {display:flex;flex-direction:column;align-items:center;border-bottom:1px solid var(--border);padding-bottom:15px;margin-bottom:15px;text-align:center;}
.user-popup-header img {width:60px;height:60px;border-radius:50%;margin-bottom:10px;border:2px solid var(--accent);}
.logout-btn {width:100%;padding:10px;background:rgba(248,113,113,0.1);color:var(--incorrect);border:1px solid var(--incorrect);border-radius:6px;font-weight:600;cursor:pointer;transition:0.2s;}

/* Core App Styling */
.layout{display:flex;flex:1;overflow:hidden;}
.sidebar{width:340px;background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;}
.sidebar-header{padding:15px;border-bottom:1px solid var(--border);font-size:0.8rem;color:var(--muted);text-transform:uppercase;letter-spacing:1px;display:flex;justify-content:space-between;align-items:center;}
.lesson-list{overflow-y:auto;flex:1;}
.li{padding:12px 15px;cursor:pointer;border-left:4px solid transparent;border-bottom:1px solid var(--border);font-size:0.85rem;display:flex;justify-content:space-between;align-items:center; gap: 8px;}
.li.active{border-left-color:var(--accent);background:var(--surface2);}
.li.completed {border-left-color: var(--correct);background: rgba(45, 212, 160, 0.08);}

.main{flex:1;display:flex;flex-direction:column;background:var(--bg);}
.meanings-strip{background:var(--bg2);border-bottom:1px solid var(--border);padding:12px 20px;min-height:65px;}
.chips{display:flex;flex-wrap:wrap;gap:10px;}
.chip{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:6px 14px;}
.chip.hl{border-color:var(--accent);background:rgba(232,81,42,0.15);}

.content-area{flex:1;padding:30px;display:flex;flex-direction:column;gap:20px;max-width:950px;margin:0 auto;width:100%;overflow-y:auto;}
.text-display{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:30px;font-family:'DM Mono',monospace;font-size:1.5rem;line-height:2.2;box-shadow:var(--shadow);min-height:140px;position:relative;}
.ch.ok{color:var(--correct);}
.ch.bad{color:var(--incorrect);background:rgba(248,113,113,0.1);}
.ch.cursor{border-bottom:3px solid var(--cursor);animation:blink 1s infinite;}
@keyframes blink { 50% { border-color: transparent; } }

.keyboard{display:flex;flex-direction:column;gap:8px;background:var(--surface);padding:20px;border-radius:var(--radius);border:1px solid var(--border);margin-top:auto;}
.key-row{display:flex;gap:8px;justify-content:center;}
.key{background:var(--surface2);border:1px solid var(--border2);border-radius:6px;padding:12px 0;flex:1;text-align:center;font-family:'DM Mono',monospace;font-size:1rem;color:var(--ink2);}
.key.space{flex:10;}
.key.target{background:var(--accent);color:white;}
.key.pressed{background:var(--correct);color:var(--bg);}
#upload-btn{padding:10px 22px;background:var(--accent);color:white;border:none;border-radius:6px;font-weight:700;cursor:pointer;}
</style>
</head>
<body>

<div id="auth-overlay" class="auth-overlay">
  <div class="auth-card">
    <div class="logo" style="margin-bottom:20px; font-size:2rem;">Type<em>বাংলা</em></div>
    <h2>Sign In</h2>
    <p>Sign in with your ATSGO account to continue.</p>
    <button id="btn-google-login" class="auth-btn google">
      <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="20">
      Sign in with Google
    </button>
  </div>
</div>

<nav>
  <div class="nav-left">
    <button id="profile-btn" class="profile-btn"><img id="nav-avatar" src=""></button>
    <div class="logo">Type<em>বাংলা</em></div>
  </div>
  <input type="file" id="pdf-upload" accept=".pdf" style="display:none">
  <button id="upload-btn" onclick="document.getElementById('pdf-upload').click()">Upload PDF</button>

  <div id="user-popup" class="user-popup">
    <div class="user-popup-header">
      <img id="popup-avatar" src="">
      <h3 id="popup-name">...</h3>
      <p id="popup-email">...</p>
    </div>
    <button id="btn-logout" class="logout-btn">Log Out</button>
  </div>
</nav>

<div class="layout">
  <aside class="sidebar">
    <div class="sidebar-header"><span>Lesson Parts</span><span id="progress">0/0</span></div>
    <div class="lesson-list" id="lesson-list"></div>
  </aside>
  <div class="main">
    <div class="meanings-strip"><div class="chips" id="chips"></div></div>
    <div class="content-area">
      <div class="text-display" id="text-display">Login and Upload PDF to start.</div>
      <div id="keyboard" class="keyboard">
          <!-- Simplified visual for brevity, script handles highlights -->
          <div class="key-row"><div class="key" data-key="space">SPACE BAR</div></div>
      </div>
    </div>
  </div>
</div>

<script type="module">
// 1. FIREBASE INITIALIZATION
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
import { getAnalytics } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-analytics.js";

const firebaseConfig = {
  apiKey: "AIzaSyA5cRcoDZ33hKmmawXASdOLV5auq2OParc",
  authDomain: "atsgo-87bf2.firebaseapp.com",
  projectId: "atsgo-87bf2",
  storageBucket: "atsgo-87bf2.firebasestorage.app",
  messagingSenderId: "574622545860",
  appId: "1:574622545860:web:cbfc8a39906a1b751e1691",
  measurementId: "G-NCR1RGTS1P"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const analytics = getAnalytics(app);
const provider = new GoogleAuthProvider();

// AUTH ELEMENTS
const authOverlay = document.getElementById('auth-overlay');
const btnGoogleLogin = document.getElementById('btn-google-login');
const profileBtn = document.getElementById('profile-btn');
const userPopup = document.getElementById('user-popup');
const btnLogout = document.getElementById('btn-logout');

onAuthStateChanged(auth, (user) => {
  if (user) {
    authOverlay.classList.add('hidden');
    profileBtn.style.display = 'block';
    document.getElementById('nav-avatar').src = user.photoURL;
    document.getElementById('popup-avatar').src = user.photoURL;
    document.getElementById('popup-name').textContent = user.displayName;
    document.getElementById('popup-email').textContent = user.email;
  } else {
    authOverlay.classList.remove('hidden');
    profileBtn.style.display = 'none';
  }
});

btnGoogleLogin.onclick = () => signInWithPopup(auth, provider);
btnLogout.onclick = () => signOut(auth);
profileBtn.onclick = (e) => { e.stopPropagation(); userPopup.classList.toggle('show'); };
window.onclick = () => userPopup.classList.remove('show');

// 2. APP LOGIC
pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

let LESSONS = [];
let currentLesson = null;
let typedText = "";

document.getElementById('pdf-upload').onchange = async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = async function() {
        const typedarray = new Uint8Array(this.result);
        const pdf = await pdfjsLib.getDocument(typedarray).promise;
        let text = "";
        for (let i = 1; i <= pdf.numPages; i++) {
            const page = await pdf.getPage(i);
            const content = await page.getTextContent();
            text += content.items.map(item => item.str).join(" ") + " ";
        }
        processText(text);
    };
    reader.readAsArrayBuffer(file);
};

function processText(raw) {
    const sentences = raw.match(/[^.!?]+[.!?]+/g) || [raw];
    LESSONS = sentences.map((s, i) => ({ id: i, en: s.trim(), completed: false }));
    loadLesson(0);
    renderSidebar();
}

function loadLesson(id) {
    currentLesson = LESSONS[id];
    typedText = "";
    renderDisplay();
}

function renderSidebar() {
    const list = document.getElementById('lesson-list');
    list.innerHTML = LESSONS.map(l => `
        <div class="li ${currentLesson?.id === l.id ? 'active' : ''} ${l.completed ? 'completed' : ''}" onclick="window.loadLesson(${l.id})">
            Part ${l.id + 1}
        </div>
    `).join('');
}

function renderDisplay() {
    const d = document.getElementById('text-display');
    d.innerHTML = currentLesson.en.split('').map((ch, i) => {
        let cls = i < typedText.length ? (typedText[i] === ch ? 'ok' : 'bad') : (i === typedText.length ? 'cursor' : '');
        return `<span class="ch ${cls}">${ch}</span>`;
    }).join('');
}

window.onkeydown = (e) => {
    if (!currentLesson || e.ctrlKey || e.metaKey) return;
    if (e.key === "Backspace") {
        typedText = typedText.slice(0, -1);
    } else if (e.key.length === 1) {
        typedText += e.key;
    }
    
    if (typedText === currentLesson.en) {
        currentLesson.completed = true;
        if(LESSONS[currentLesson.id + 1]) loadLesson(currentLesson.id + 1);
        renderSidebar();
    }
    renderDisplay();
};

window.loadLesson = loadLesson;
</script>

</body>
</html>
